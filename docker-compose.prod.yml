networks:
  traefik:
    external: true
  # Postgres and the web container only, without Internet access: a compromised database cannot
  # reach out. The web container keeps its outbound access through the traefik network.
  db:
    internal: true

volumes:
  # Postgres 18, created by the cutover (scripts/postgres-18-upgrade.sh). External on purpose:
  # a routine deploy that runs before the cutover fails ("external volume not found")
  # instead of starting an empty database. The Postgres 16 volume eau-robinet_pgdata is kept.
  pgdata:
    external: true
    name: eau-robinet_pgdata18

services:
  web:
    image: ${WEB_IMAGE}
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    environment:
      DATABASE_URL: ${DATABASE_URL}
      DATABASE_POOL_MAX: "5"
      DATABASE_SSL: "0"
      SENTRY_DSN: ${SENTRY_DSN:-}
      NODE_ENV: production
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.fontus.rule=Host(`${TRAEFIK_HOST}`)"
      - "traefik.http.routers.fontus.entrypoints=websecure"
      - "traefik.http.routers.fontus.tls.certresolver=le"
      # Deploys swap containers without downtime (deploy/remote-deploy.sh): a request that reaches
      # the old container as it closes is retried on the new one.
      - "traefik.http.routers.fontus.middlewares=fontus-retry"
      - "traefik.http.middlewares.fontus-retry.retry.attempts=3"
      - "traefik.http.middlewares.fontus-retry.retry.initialinterval=100ms"
      - "traefik.http.routers.fontus-www.rule=Host(`www.${TRAEFIK_HOST}`)"
      - "traefik.http.routers.fontus-www.entrypoints=websecure"
      - "traefik.http.routers.fontus-www.tls.certresolver=le"
      - "traefik.http.routers.fontus-www.middlewares=fontus-www-redirect"
      - "traefik.http.routers.fontus-www.service=fontus"
      - "traefik.http.middlewares.fontus-www-redirect.redirectregex.regex=^https://www\\.(.+)"
      - "traefik.http.middlewares.fontus-www-redirect.redirectregex.replacement=https://$${1}"
      - "traefik.http.middlewares.fontus-www-redirect.redirectregex.permanent=true"
      - "traefik.http.services.fontus.loadbalancer.server.port=3100"
      # Traefik polls /api/ready (no database call) every second; the deploy makes it answer 503 in
      # the old container just before stopping it, so traffic leaves it first.
      - "traefik.http.services.fontus.loadbalancer.healthcheck.path=/api/ready"
      - "traefik.http.services.fontus.loadbalancer.healthcheck.interval=1s"
      - "traefik.http.services.fontus.loadbalancer.healthcheck.timeout=1s"
      - "traefik.docker.network=traefik"
    networks:
      - traefik
      - db
    depends_on:
      - postgres
    # Traefik only routes to a healthy container; the deploy waits on it before retiring the old one.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3100/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 8s
      retries: 4
      start_period: 120s
      start_interval: 2s
    restart: unless-stopped
    mem_limit: 768m
    pids_limit: 256
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  postgres:
    image: postgres:18.7-alpine@sha256:b6972e1115a4ff8eba5d7f7d19184926d1e16d7d1136ae1e1a7ebf286da0f015
    environment:
      POSTGRES_DB: fontus
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql
    networks:
      - db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d fontus"]
      interval: 2s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped
    mem_limit: 512m
    pids_limit: 256
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
