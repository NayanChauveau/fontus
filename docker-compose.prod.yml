# Deploy kit (deploy/release.py): every per-site value comes from deploy/site_config.py
# (compose_env), the project name through --project-name, the rest through the SITE_* variables.
# The www redirect router is added by the kit (deploy.wwwRedirect), never written here.
x-app: &app
  image: ${WEB_IMAGE:?WEB_IMAGE requis}
  environment: &app-env
    NODE_ENV: production
    DATABASE_URL: ${DATABASE_URL:?DATABASE_URL requis}
    DATABASE_POOL_MAX: '5'
    DATABASE_SSL: '0'
    SENTRY_DSN: ${SENTRY_DSN:-}
  # Postgres and the one-off jobs stay on the internal network, without Internet access: a
  # compromised database cannot reach out. The web container also joins traefik (outbound
  # access to Hub'Eau and Sentry).
  networks: [internal]
  # Docker keeps container logs on the VPS disk: rotated, at most 30 MB per container.
  logging: &logging
    driver: json-file
    options:
      max-size: '10m'
      max-file: '3'

services:
  web:
    <<: *app
    environment:
      <<: *app-env
      PORT: ${SITE_PORT:?SITE_PORT requis}
    restart: unless-stopped
    mem_limit: 768m
    pids_limit: 256
    # Hardening: no privilege gain, no capability, read-only filesystem (the code also belongs to
    # root, see Dockerfile). Writable, in memory only: the deploy's drain flag (/tmp/draining,
    # deploy/release.py) and the Next.js caches (pages, robots, sitemap, icons, OG images).
    security_opt: ['no-new-privileges:true']
    cap_drop: [ALL]
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /app/.next/cache:size=64m,uid=1001,gid=1001,mode=0700
      - /app/.next/server/route-cache:size=64m,uid=1001,gid=1001,mode=0700
    networks: [internal, traefik]
    depends_on:
      postgres:
        condition: service_healthy
    # Traefik only routes to a healthy container; the deploy waits on it before retiring the old one.
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:${SITE_PORT}/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 8s
      retries: 4
      start_period: 120s
      # Checked every 2 s while starting: the deploy swaps containers as soon as the new one is healthy.
      start_interval: 2s
    # The same labels as the containers deployed before the kit: during the cutover both compose
    # projects serve under these router and service names, and Traefik merges them only when they
    # are identical (tests/test_compose.py). No explicit router service: the container has one.
    labels:
      - 'traefik.enable=true'
      - 'traefik.docker.network=traefik'
      - 'traefik.http.routers.${SITE_TRAEFIK_NAME}.rule=Host(`${TRAEFIK_HOST:?TRAEFIK_HOST requis}`)'
      - 'traefik.http.routers.${SITE_TRAEFIK_NAME}.entrypoints=websecure'
      - 'traefik.http.routers.${SITE_TRAEFIK_NAME}.tls.certresolver=le'
      # Deploys swap containers without downtime (deploy/release.py): a request that reaches the
      # old container as it closes is retried on the new one.
      - 'traefik.http.routers.${SITE_TRAEFIK_NAME}.middlewares=${SITE_TRAEFIK_NAME}-retry'
      - 'traefik.http.middlewares.${SITE_TRAEFIK_NAME}-retry.retry.attempts=3'
      - 'traefik.http.middlewares.${SITE_TRAEFIK_NAME}-retry.retry.initialinterval=100ms'
      - 'traefik.http.services.${SITE_TRAEFIK_NAME}.loadbalancer.server.port=${SITE_PORT}'
      # Traefik polls /api/ready (no database call) every second; the deploy makes it answer 503 in
      # the old container just before stopping it, so traffic leaves it first.
      - 'traefik.http.services.${SITE_TRAEFIK_NAME}.loadbalancer.healthcheck.path=/api/ready'
      - 'traefik.http.services.${SITE_TRAEFIK_NAME}.loadbalancer.healthcheck.interval=1s'
      - 'traefik.http.services.${SITE_TRAEFIK_NAME}.loadbalancer.healthcheck.timeout=1s'

  postgres:
    image: postgres:18.7-alpine@sha256:b6972e1115a4ff8eba5d7f7d19184926d1e16d7d1136ae1e1a7ebf286da0f015
    restart: unless-stopped
    mem_limit: 512m
    pids_limit: 256
    logging: *logging
    environment:
      POSTGRES_DB: ${SITE_DB_NAME:?SITE_DB_NAME requis}
      POSTGRES_USER: ${SITE_DB_USER:?SITE_DB_USER requis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD requis}
    volumes:
      - pgdata:/var/lib/postgresql
    networks: [internal]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${SITE_DB_USER} -d ${SITE_DB_NAME}']
      interval: 3s
      timeout: 5s
      retries: 20
    labels:
      traefik.enable: 'false'

  # One-off job of every release (deploy.opsJobs), from the ops image of the same commit: applies
  # the SQL migrations (idempotent) before the new web container starts.
  migrate:
    <<: *app
    image: ${OPS_IMAGE:?OPS_IMAGE requis}
    profiles: [operations]

  # Run by the release before it uses an existing database volume: the cluster must still be there.
  data-check:
    image: postgres:18.7-alpine@sha256:b6972e1115a4ff8eba5d7f7d19184926d1e16d7d1136ae1e1a7ebf286da0f015
    profiles: [operations]
    network_mode: none
    volumes:
      - pgdata:/var/lib/postgresql:ro
    entrypoint: ['test', '-s', '/var/lib/postgresql/18/docker/PG_VERSION']

networks:
  traefik:
    external: true
    name: traefik
  internal:
    internal: true

volumes:
  # External on purpose: compose never creates nor removes the database. The volume carries the
  # owner label (deploy.volumeOwnerLabel) checked by every release; the cutover creates it.
  pgdata:
    external: true
    name: ${SITE_VOLUME_DATABASE:?SITE_VOLUME_DATABASE requis}
