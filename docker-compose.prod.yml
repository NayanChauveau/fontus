networks:
  traefik:
    external: true
  internal: {}

volumes:
  # Postgres 18, created by the cutover (scripts/postgres-18-upgrade.sh). External on purpose:
  # a routine deploy that runs before the cutover fails ("external volume not found")
  # instead of starting an empty database. The Postgres 16 volume eau-robinet_pgdata is kept.
  pgdata:
    external: true
    name: eau-robinet_pgdata18

services:
  web:
    image: ${WEB_IMAGE}
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    environment:
      DATABASE_URL: ${DATABASE_URL}
      DATABASE_POOL_MAX: "5"
      DATABASE_SSL: "0"
      SENTRY_DSN: ${SENTRY_DSN:-}
      NODE_ENV: production
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.fontus.rule=Host(`${TRAEFIK_HOST}`)"
      - "traefik.http.routers.fontus.entrypoints=websecure"
      - "traefik.http.routers.fontus.tls.certresolver=le"
      - "traefik.http.routers.fontus-www.rule=Host(`www.${TRAEFIK_HOST}`)"
      - "traefik.http.routers.fontus-www.entrypoints=websecure"
      - "traefik.http.routers.fontus-www.tls.certresolver=le"
      - "traefik.http.routers.fontus-www.middlewares=fontus-www-redirect"
      - "traefik.http.routers.fontus-www.service=fontus"
      - "traefik.http.middlewares.fontus-www-redirect.redirectregex.regex=^https://www\\.(.+)"
      - "traefik.http.middlewares.fontus-www-redirect.redirectregex.replacement=https://$${1}"
      - "traefik.http.middlewares.fontus-www-redirect.redirectregex.permanent=true"
      - "traefik.http.services.fontus.loadbalancer.server.port=3100"
      - "traefik.docker.network=traefik"
      - 'com.datadoghq.ad.logs=[{"source":"nextjs","service":"fontus"}]'
    networks:
      - traefik
      - internal
    depends_on:
      - postgres
    restart: unless-stopped

  postgres:
    image: postgres:18.7-alpine@sha256:b6972e1115a4ff8eba5d7f7d19184926d1e16d7d1136ae1e1a7ebf286da0f015
    environment:
      POSTGRES_DB: fontus
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d fontus"]
      interval: 2s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped
