name: Postgres 18 upgrade

# One-off move of the production database from Postgres 16 to 18 (see deploy/README.md).
# rehearsal: copies production into a throwaway Postgres 18 and verifies it; production untouched.
# cutover:   stops web, dumps, restores into eau-robinet_pgdata18, verifies, switches Compose.
#            Take a Hostinger snapshot first and tick "snapshot_done".
# rollback:  later way back to Postgres 16 on its untouched volume (data written on 18 is lost).
# The script runs detached on the VPS (setsid + nohup): a dropped SSH session or a cancelled
# job cannot interrupt it halfway. This job only follows its log until it finishes.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "rehearsal (safe), cutover (production switch) or rollback"
        type: choice
        options: [rehearsal, cutover, rollback]
        default: rehearsal
      snapshot_done:
        description: "Hostinger snapshot taken just now (required for cutover)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: deploy-main # never overlaps a routine deploy
  cancel-in-progress: false

jobs:
  upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Refuse a cutover without snapshot
        if: inputs.mode == 'cutover' && !inputs.snapshot_done
        run: |
          echo "::error::Take the Hostinger snapshot first, then rerun with snapshot_done ticked."
          exit 1

      - name: Run on the VPS
        uses: appleboy/ssh-action@2ead5e36573f08b82fbfce1504f1a4b05a647c6f # v1.2.2
        env:
          MODE: ${{ inputs.mode }}
          SNAPSHOT_DONE: ${{ inputs.snapshot_done }}
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          command_timeout: 15m
          envs: MODE,SNAPSHOT_DONE
          script: |
            set -euo pipefail
            # The script is installed by the push deploy (deploy/remote-deploy.sh); no git on the VPS.
            cd /srv/eau-robinet
            install -d -m 700 /srv/backups/eau-robinet
            log="/srv/backups/eau-robinet/$(date -u +%Y%m%dT%H%M%SZ)-$MODE.log"
            SNAPSHOT_DONE="$SNAPSHOT_DONE" setsid nohup bash scripts/postgres-18-upgrade.sh "$MODE" > "$log" 2>&1 < /dev/null &
            pid=$!
            echo "running detached (pid $pid), log: $log"
            shown=0
            while kill -0 "$pid" 2>/dev/null; do
              lines=$(wc -l < "$log"); [ "$lines" -gt "$shown" ] && tail -n +"$((shown + 1))" "$log" | head -n "$((lines - shown))"; shown=$lines
              sleep 3
            done
            tail -n +"$((shown + 1))" "$log"
            grep -q "^\[.*\] RESULT: .* OK" "$log"
