name: Adopt production (one-off)
# One-off move of today's production to the deploy kit's project (deploy/adopt.py): copy the
# database into the kit's labelled volume, check every table's row count, then (cutover only) run
# the first kit release and retire the old containers without a gap for readers.
# Run `rehearsal` first: nothing changes for the public site. Then take a Hostinger snapshot and
# run `cutover` with snapshot_done ticked. Afterwards set PRODUCTION_DEPLOY_ENABLED=true.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'rehearsal: copy and check, then remove the copy. cutover: switch production.'
        type: choice
        options: [rehearsal, cutover]
        default: rehearsal
        required: true
      snapshot_done:
        description: 'Cutover only: a Hostinger snapshot of the VPS was taken just before.'
        type: boolean
        default: false
        required: true
permissions:
  contents: read
concurrency:
  group: ${{ github.repository }}-production
  cancel-in-progress: false
jobs:
  adopt:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production
    # The GHCR token travels to the VPS (release login): read-only.
    permissions:
      contents: read
      packages: read
    env:
      ADOPT_MODE: ${{ inputs.mode }}
      SNAPSHOT_DONE: ${{ inputs.snapshot_done }}
      DEPLOY_ENABLED: ${{ vars.PRODUCTION_DEPLOY_ENABLED }}
      TRAEFIK_HOST: ${{ vars.PRODUCTION_HOST }}
      TRAEFIK_ALIASES: ${{ vars.PRODUCTION_ALIASES }}
      PUBLIC_INDEXING: ${{ vars.PUBLIC_INDEXING || 'true' }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_PORT: ${{ secrets.SSH_PORT }}
      SSH_KEY: ${{ secrets.SSH_KEY }}
      SSH_PASSPHRASE: ${{ secrets.SSH_PASSPHRASE }}
      SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
      SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
      GHCR_USER: ${{ github.actor }}
      GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Refuse a cutover without snapshot, or once the kit deploys production
        # Values from inputs.snapshot_done and vars.PRODUCTION_DEPLOY_ENABLED, read through env.
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF}" != 'refs/heads/main' ]; then echo '::error::Run from main.'; exit 1; fi
          if [ "${DEPLOY_ENABLED}" = 'true' ]; then echo '::error::PRODUCTION_DEPLOY_ENABLED is true: production is already adopted.'; exit 1; fi
          if [ "${ADOPT_MODE}" = 'cutover' ] && [ "${SNAPSHOT_DONE}" != 'true' ]; then
            echo '::error::Take the Hostinger snapshot, then run the cutover with snapshot_done ticked.'; exit 1
          fi
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      # The release images of this commit, built by the push to main ("Deploy production", job image).
      - name: Release image tags of this commit
        run: |
          echo "WEB_IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA}" >> "$GITHUB_ENV"
          echo "OPS_IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA}-ops" >> "$GITHUB_ENV"
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Check both images exist before reaching the server
        run: |
          docker manifest inspect "$WEB_IMAGE" > /dev/null
          docker manifest inspect "$OPS_IMAGE" > /dev/null
      - name: Validate settings before any production write
        run: python3 deploy/preflight.py
      - name: Adopt production on the VPS (detached there; this step follows its log)
        run: python3 deploy/adopt.py dispatch
