name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-main
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  image:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      web_image: ${{ steps.meta.outputs.web_image }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - id: meta
        run: |
          image="ghcr.io/$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          echo "web_image=${image}:${GITHUB_SHA}" >> "${GITHUB_OUTPUT}"
          echo "tags=${image}:${GITHUB_SHA},${image}:main" >> "${GITHUB_OUTPUT}"

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: production
          push: true
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.2
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          TRAEFIK_HOST: ${{ secrets.TRAEFIK_HOST }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          WEB_IMAGE: ${{ needs.image.outputs.web_image }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          command_timeout: 15m
          envs: POSTGRES_PASSWORD,SENTRY_DSN,TRAEFIK_HOST,DATABASE_URL,WEB_IMAGE,GHCR_USER,GHCR_TOKEN
          script: |
            set -euo pipefail

            export GIT_SSH_COMMAND='ssh -i ~/.ssh/eau_robinet_deploy -o IdentitiesOnly=yes'

            if [ ! -d /srv/eau-robinet/.git ]; then
              git clone git@github.com:${{ github.repository }}.git /srv/eau-robinet
            fi

            cd /srv/eau-robinet
            git pull

            if [ ! -f .env ]; then
              printf "%s\n" \
                "POSTGRES_PASSWORD=${POSTGRES_PASSWORD}" \
                "SENTRY_DSN=${SENTRY_DSN}" \
                "TRAEFIK_HOST=${TRAEFIK_HOST}" \
                "DATABASE_URL=${DATABASE_URL}" \
                "DATABASE_POOL_MAX=5" \
                "DATABASE_SSL=0" \
                "NODE_ENV=production" \
                "WEB_IMAGE=${WEB_IMAGE}" \
                > .env
              chmod 600 .env
            elif grep -q '^WEB_IMAGE=' .env; then
              sed -i "s|^WEB_IMAGE=.*|WEB_IMAGE=${WEB_IMAGE}|" .env
            else
              printf "WEB_IMAGE=%s\n" "${WEB_IMAGE}" >> .env
            fi

            echo "${GHCR_TOKEN}" | docker login ghcr.io -u "${GHCR_USER}" --password-stdin
            docker compose -f docker-compose.prod.yml pull web
            docker compose -f docker-compose.prod.yml up -d --remove-orphans postgres
            docker compose -f docker-compose.prod.yml up -d --force-recreate web
            docker logout ghcr.io
