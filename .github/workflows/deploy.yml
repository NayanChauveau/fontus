name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  image:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    timeout-minutes: 30
    outputs:
      web_image: ${{ steps.meta.outputs.web_image }}
    steps:
      - uses: actions/checkout@v5

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v4

      - id: meta
        run: |
          image="ghcr.io/$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          echo "web_image=${image}:${GITHUB_SHA}" >> "${GITHUB_OUTPUT}"
          echo "tags=${image}:${GITHUB_SHA},${image}:main" >> "${GITHUB_OUTPUT}"

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          target: production
          push: true
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: image
    runs-on: ubuntu-latest
    # The GHCR token travels to the VPS: read-only, so a compromised server cannot push an image.
    permissions:
      contents: read
      packages: read
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      # Push deploy: CI sends only the runtime files and the secrets (one archive on stdin);
      # deploy/remote-deploy.sh installs them in /srv/eau-robinet. No git or GitHub key on the VPS.
      - name: Deploy over SSH
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_PASSPHRASE: ${{ secrets.SSH_PASSPHRASE }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          TRAEFIK_HOST: ${{ secrets.TRAEFIK_HOST }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          WEB_IMAGE: ${{ needs.image.outputs.web_image }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          for name in POSTGRES_PASSWORD DATABASE_URL TRAEFIK_HOST WEB_IMAGE; do
            [ -n "${!name}" ] || { echo "::error::$name is empty"; exit 1; }
          done
          for name in POSTGRES_PASSWORD DATABASE_URL TRAEFIK_HOST WEB_IMAGE SENTRY_DSN GHCR_USER GHCR_TOKEN; do
            case "${!name}" in *$'\n'*|*$'\r'*) echo "::error::$name contains a line break"; exit 1 ;; esac
          done
          # Pin the server's host keys (secret SSH_KNOWN_HOSTS, from ssh-keyscan checked against the
          # server's own key files); "*" so the pin does not depend on how SSH_HOST is written.
          [ -n "$SSH_KNOWN_HOSTS" ] || { echo "::error::SSH_KNOWN_HOSTS secret is missing"; exit 1; }
          printf '%s\n' "$SSH_KNOWN_HOSTS" | awk 'NF >= 3 { $1 = "*"; print }' > "$RUNNER_TEMP/known_hosts"
          key="$RUNNER_TEMP/vps_key"
          payload="$RUNNER_TEMP/payload"
          trap 'rm -rf "$key" "$payload" "$payload.tgz"' EXIT
          (umask 077; printf '%s\n' "$SSH_KEY" > "$key")
          if [ -n "$SSH_PASSPHRASE" ]; then
            ssh-keygen -p -q -P "$SSH_PASSPHRASE" -N "" -f "$key" >/dev/null
          fi
          (umask 077; mkdir "$payload" && printf '%s\n' \
            "POSTGRES_PASSWORD=$POSTGRES_PASSWORD" "SENTRY_DSN=$SENTRY_DSN" "TRAEFIK_HOST=$TRAEFIK_HOST" \
            "DATABASE_URL=$DATABASE_URL" "DATABASE_POOL_MAX=5" "DATABASE_SSL=0" "NODE_ENV=production" \
            "WEB_IMAGE=$WEB_IMAGE" "GHCR_USER=$GHCR_USER" "GHCR_TOKEN=$GHCR_TOKEN" > "$payload/incoming.env")
          mkdir -p "$payload/scripts" "$payload/supabase/migrations"
          cp docker-compose.prod.yml "$payload/"
          cp scripts/apply-prod-migrations.sh scripts/postgres-18-upgrade.sh "$payload/scripts/"
          cp supabase/migrations/*.sql "$payload/supabase/migrations/"
          tar -czf "$payload.tgz" -C "$payload" docker-compose.prod.yml scripts supabase incoming.env
          timeout 900 ssh -i "$key" -p "${SSH_PORT:-22}" -o BatchMode=yes -o ConnectTimeout=20 \
            -o ServerAliveInterval=15 -o ServerAliveCountMax=4 -o LogLevel=ERROR \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/known_hosts" "$SSH_USER@$SSH_HOST" \
            "$(cat deploy/remote-deploy.sh)" < "$payload.tgz"
