name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.2
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          TRAEFIK_HOST: ${{ secrets.TRAEFIK_HOST }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          envs: POSTGRES_PASSWORD,SENTRY_DSN,TRAEFIK_HOST,DATABASE_URL
          script: |
            set -euo pipefail

            export GIT_SSH_COMMAND='ssh -i ~/.ssh/eau_robinet_deploy -o IdentitiesOnly=yes'

            if [ ! -d /srv/eau-robinet/.git ]; then
              git clone git@github.com:${{ github.repository }}.git /srv/eau-robinet
            fi

            cd /srv/eau-robinet
            git pull

            if [ ! -f .env ]; then
              printf "%s\n" \
                "POSTGRES_PASSWORD=${POSTGRES_PASSWORD}" \
                "SENTRY_DSN=${SENTRY_DSN}" \
                "TRAEFIK_HOST=${TRAEFIK_HOST}" \
                "DATABASE_URL=${DATABASE_URL}" \
                "DATABASE_POOL_MAX=5" \
                "DATABASE_SSL=0" \
                "NODE_ENV=production" \
                > .env
              chmod 600 .env
            fi

            docker compose -f docker-compose.prod.yml build --pull
            docker compose -f docker-compose.prod.yml up -d \
              --remove-orphans --pull always --force-recreate
