name: Deploy production
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: ${{ github.repository }}-production
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  ci:
    uses: ./.github/workflows/ci.yml
  image:
    # Built while the tests run: the SHA-tagged image is only ever deployed once `ci` has passed.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.tag.outputs.image }}
      ops: ${{ steps.tag.outputs.ops }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Immutable tags only (one per commit): no mutable tag that a later push could move.
      - id: tag
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "ops=ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA}-ops" >> "$GITHUB_OUTPUT"
      # Web image: Next.js standalone server only.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          target: production
          push: true
          provenance: false
          tags: ${{ steps.tag.outputs.image }}
          # One cache scope per target: a shared scope would keep only the last build's manifest.
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
      # Ops image for the release's one-off job (SQL migrations).
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          target: ops
          push: true
          provenance: false
          tags: ${{ steps.tag.outputs.ops }}
          cache-from: |
            type=gha,scope=ops
            type=gha,scope=web
          cache-to: type=gha,mode=max,scope=ops
  deploy:
    # Explicit opt-in repository variable: off until the production cutover has created the
    # labelled database volume and runtime.json (a first release before it would start an empty
    # database next to the running site).
    if: github.ref == 'refs/heads/main' && vars.PRODUCTION_DEPLOY_ENABLED == 'true'
    needs: [ci, image]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    # The GHCR token travels to the VPS: read-only, so a compromised server cannot push an image.
    permissions:
      contents: read
      packages: read
    env:
      WEB_IMAGE: ${{ needs.image.outputs.image }}
      OPS_IMAGE: ${{ needs.image.outputs.ops }}
      TRAEFIK_HOST: ${{ vars.PRODUCTION_HOST }}
      TRAEFIK_ALIASES: ${{ vars.PRODUCTION_ALIASES }}
      # Unused by this site (it sends its own robots rules); the kit validates it.
      PUBLIC_INDEXING: ${{ vars.PUBLIC_INDEXING || 'true' }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_PORT: ${{ secrets.SSH_PORT }}
      SSH_KEY: ${{ secrets.SSH_KEY }}
      SSH_PASSPHRASE: ${{ secrets.SSH_PASSPHRASE }}
      SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
      SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
      GHCR_USER: ${{ github.actor }}
      GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Validate settings before any production write
        run: python3 deploy/preflight.py
      - name: Deploy exact release through SSH
        run: python3 deploy/dispatch.py
