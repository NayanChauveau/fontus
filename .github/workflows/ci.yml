name: CI

on:
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        task: [type-check, lint, knip, test:coverage]
    name: ${{ matrix.task }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
        with:
          version: 11.22.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm ${{ matrix.task }}

  python:
    runs-on: ubuntu-latest
    name: python tests
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - run: python3 -m unittest discover -s tests -p 'test_*.py'

  container:
    # Both production images, run read-only against a disposable Postgres (deploy/smoke.py):
    # migrations twice, web health, the pages of site.config.json, backup and persistence.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Validate GitHub Actions
        run: docker run --rm -v "$PWD:/repo:ro" -w /repo rhysd/actionlint:1.7.7 -color
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          target: production
          load: true
          tags: app:ci
          # One cache scope per target: a shared scope would keep only the last build's manifest.
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          target: ops
          load: true
          tags: app:ci-ops
          cache-from: |
            type=gha,scope=ops
            type=gha,scope=web
          cache-to: type=gha,mode=max,scope=ops
      - name: Test production images and persistence
        env:
          SMOKE_IMAGE: app:ci
          SMOKE_OPS_IMAGE: app:ci-ops
        run: python3 deploy/smoke.py
